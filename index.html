<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste EPUB</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

#viewer {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script>

const book = ePub(
    "uma-historia-qualquer-de-uma-pessoa-qualquer.epub"
);

const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%",
    spread: "none"
});

rendition.display()
    .then(() => {
        console.log("EPUB abriu!");
    })
    .catch(error => {
        console.error("Erro ao abrir EPUB:", error);
        document.body.innerHTML =
            "<h2 style='font-family:Arial;text-align:center;margin-top:50px'>" +
            "❌ Erro ao abrir o EPUB<br><br>" +
            "<small>" + error + "</small>" +
            "</h2>";
    });

</script>

</body>
</html>
