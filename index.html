```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste EPUB</title>
</head>

<body>

<h1 id="status">Carregando...</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<script>

document.getElementById("status").innerText =
    "Bibliotecas carregadas. Abrindo EPUB...";

console.log("JSZip:", typeof JSZip);
console.log("Epub.js:", typeof ePub);

const book = ePub(
    "./uma-historia-qualquer-de-uma-pessoa-qualquer.epub"
);

console.log("Book criado:", book);

book.ready.then(() => {

    console.log("EPUB CARREGOU!");

    document.getElementById("status").innerText =
        "✅ EPUB CARREGOU!";

}).catch(error => {

    console.error("ERRO:", error);

    document.getElementById("status").innerText =
        "❌ ERRO: " + error;

});

setTimeout(() => {

    if (
        document.getElementById("status").innerText !==
        "✅ EPUB CARREGOU!"
    ) {

        document.getElementById("status").innerText =
            "⚠️ Ainda travado depois de 10 segundos.";

        console.log(
            "O carregamento do EPUB não terminou."
        );
    }

}, 10000);

</script>

</body>
</html>
