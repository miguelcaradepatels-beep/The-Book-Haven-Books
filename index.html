```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste EPUB</title>
</head>

<body>

<h1 id="status">Iniciando...</h1>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script>

document.getElementById("status").innerText =
    "Epub.js carregado. Tentando abrir EPUB...";

console.log("Epub.js:", typeof ePub);

const book = ePub(
    "./uma-historia-qualquer-de-uma-pessoa-qualquer.epub"
);

document.getElementById("status").innerText =
    "EPUB enviado para o Epub.js...";

console.log("Objeto book criado:", book);

setTimeout(() => {

    document.getElementById("status").innerText =
        "⚠️ O EPUB não terminou de carregar após 10 segundos.";

    console.log("TIMEOUT: book.ready não terminou.");

}, 10000);

book.ready.then(() => {

    document.getElementById("status").innerText =
        "✅ EPUB CARREGOU!";

    console.log("EPUB CARREGOU!");

}).catch(error => {

    document.getElementById("status").innerText =
        "❌ ERRO: " + error;

    console.error("ERRO:", error);

});

</script>

</body>
</html>
```
