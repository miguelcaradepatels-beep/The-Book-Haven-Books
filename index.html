<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

#viewer {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="viewer"></div>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script>

const book = ePub(
    "./uma-historia-qualquer-de-uma-pessoa-qualquer.epub"
);

const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%",
    spread: "none"
});

book.ready.then(() => {

    console.log("EPUB pronto.");

    return book.loaded.spine;

}).then(spine => {

    console.log("Spine carregado.");

    console.log(spine);

    return rendition.display(
        "OEBPS/3_um-comeco-normal.xhtml"
    );

}).then(() => {

    console.log("CAPÍTULO ABRIU!");

}).catch(error => {

    console.error("ERRO:", error);

    document.body.innerHTML =
        "<h2 style='font-family:Arial;padding:30px'>" +
        "Erro ao abrir o capítulo.<br><br>" +
        error +
        "</h2>";

});

</script>

</body>
</html>
