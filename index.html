<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste EPUB</title>

<style>
body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f4ead8;
    color: #33271f;
}

#status {
    white-space: pre-wrap;
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>📖 Testando EPUB</h1>

<div id="status">
Iniciando...
</div>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script>

const status = document.getElementById("status");

status.textContent =
    "Epub.js carregado.\nTentando abrir o EPUB...";

try {

    const book = ePub(
        "./uma-historia-qualquer-de-uma-pessoa-qualquer.epub"
    );

    status.textContent =
        "EPUB encontrado.\n" +
        "Tentando renderizar...";

    const rendition = book.renderTo("viewer", {
        width: "100%",
        height: "600px",
        spread: "none"
    });

    rendition.display()
        .then(() => {

            status.textContent =
                "✅ O EPUB foi aberto com sucesso!";

        })
        .catch(error => {

            status.textContent =
                "❌ ERRO AO ABRIR O EPUB:\n\n" +
                error +
                "\n\n" +
                JSON.stringify(error);

            console.error(error);

        });

} catch (error) {

    status.textContent =
        "❌ ERRO:\n\n" +
        error;

    console.error(error);

}

</script>

<div id="viewer"></div>

</body>
</html>
