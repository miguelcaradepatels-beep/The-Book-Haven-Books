<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Book Haven</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4ead8;
    color: #33271f;
    overflow: hidden;
    transition: background .2s, color .2s;
}

/* =========================
   CABEÇALHO
========================= */

header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: rgba(255,255,255,.55);
    border-bottom: 1px solid rgba(0,0,0,.08);
    backdrop-filter: blur(8px);
    position: relative;
    z-index: 10;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.buttons {
    display: flex;
    gap: 7px;
}

button {
    border: none;
    background: rgba(0,0,0,.07);
    color: inherit;
    border-radius: 8px;
    padding: 8px 11px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: rgba(0,0,0,.13);
}

/* =========================
   PROGRESSO
========================= */

.progress-area {
    height: 4px;
    background: rgba(0,0,0,.08);
}

#progress {
    width: 0%;
    height: 100%;
    background: #9b6b43;
}

/* =========================
   LEITOR
========================= */

#viewer {
    width: 100%;
    height: calc(100% - 62px);
}

/* =========================
   PAINEL
========================= */

.panel {
    position: fixed;
    top: 0;
    right: -290px;
    width: 290px;
    height: 100%;
    background: #f8f0e3;
    box-shadow: -5px 0 20px rgba(0,0,0,.15);
    padding: 20px;
    z-index: 20;
    transition: right .2s;
    overflow-y: auto;
}

.panel.open {
    right: 0;
}

.panel h2 {
    margin-top: 0;
}

.option {
    margin: 18px 0;
}

.option label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
}

input[type="range"] {
    width: 100%;
}

/* =========================
   MODO FOCO
========================= */

body.focus header {
    display: none;
}

body.focus #viewer {
    height: 100%;
}

/* =========================
   TEMA ESCURO
========================= */

body.dark {
    background: #171513;
    color: #eee4d8;
}

body.dark header {
    background: rgba(30,28,26,.9);
    border-color: rgba(255,255,255,.08);
}

body.dark .panel {
    background: #24211e;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        height: 52px;
        padding: 0 10px;
    }

    .logo {
        font-size: 16px;
    }

    button {
        padding: 7px 8px;
        font-size: 13px;
    }

    #viewer {
        height: calc(100% - 56px);
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        📖 The Book Haven
    </div>

    <div class="buttons">
        <button onclick="previousPage()">←</button>
        <button onclick="nextPage()">→</button>
        <button onclick="bookmark()">🔖</button>
        <button onclick="toggleFocus()">⛶</button>
        <button onclick="openSettings()">⚙️</button>
    </div>

</header>

<div class="progress-area">
    <div id="progress"></div>
</div>

<div id="viewer"></div>

<!-- PAINEL DE CONFIGURAÇÕES -->

<div id="settings" class="panel">

    <button onclick="closeSettings()">✕ Fechar</button>

    <h2>Configurações</h2>

    <div class="option">
        <label>Tamanho da fonte</label>

        <input
            id="fontSize"
            type="range"
            min="80"
            max="160"
            value="100"
            oninput="changeFontSize(this.value)"
        >
    </div>

    <div class="option">
        <label>Espaçamento</label>

        <input
            id="lineHeight"
            type="range"
            min="1"
            max="2"
            step="0.1"
            value="1.5"
            oninput="changeLineHeight(this.value)"
        >
    </div>

    <div class="option">

        <button onclick="toggleTheme()">
            🌓 Alternar tema
        </button>

    </div>

    <div class="option">

        <button onclick="goToBookmark()">
            🔖 Ir para marcador
        </button>

    </div>

</div>

<!-- Epub.js -->

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script>

/* =========================================
   CONFIGURAÇÃO
========================================= */

const EPUB_FILE =
    "uma-historia-qualquer-de-uma-pessoa-qualquer.epub";

const STORAGE_POSITION =
    "bookhaven_position";

const STORAGE_BOOKMARK =
    "bookhaven_bookmark";

const STORAGE_THEME =
    "bookhaven_theme";

const STORAGE_FONT =
    "bookhaven_font";

const STORAGE_LINE =
    "bookhaven_line";


/* =========================================
   VARIÁVEIS
========================================= */

let book;
let rendition;

let currentLocation = null;
let savedBookmark = localStorage.getItem(STORAGE_BOOKMARK);


/* =========================================
   INICIAR LIVRO
========================================= */

function startBook() {

    book = ePub(EPUB_FILE);

    rendition = book.renderTo("viewer", {

        width: "100%",
        height: "100%",

        spread: "none",

        flow: "paginated",

        allowScriptedContent: false

    });


    /* posição salva */

    const savedPosition =
        localStorage.getItem(STORAGE_POSITION);


    /* abre o livro */

    rendition.display(
        savedPosition || undefined
    ).then(() => {

        console.log("Livro carregado.");

        applySavedSettings();

        updateProgress();

    });


    /* quando muda de página */

    rendition.on("relocated", location => {

        currentLocation = location;

        savePosition(location);

        updateProgress();

    });


    /* teclado */

    document.addEventListener("keydown", event => {

        if (event.key === "ArrowRight") {

            nextPage();

        }

        if (event.key === "ArrowLeft") {

            previousPage();

        }

        if (event.key === "Escape") {

            closeSettings();

        }

    });

}


/* =========================================
   SALVAR POSIÇÃO
========================================= */

function savePosition(location) {

    if (!location || !location.start) {
        return;
    }

    if (location.start.cfi) {

        localStorage.setItem(
            STORAGE_POSITION,
            location.start.cfi
        );

    }

}


/* =========================================
   PROGRESSO
========================================= */

function updateProgress() {

    if (
        !currentLocation ||
        !currentLocation.start
    ) {

        return;

    }

    let percentage =
        currentLocation.start.percentage;

    if (typeof percentage !== "number") {
        return;
    }

    percentage =
        Math.max(
            0,
            Math.min(
                100,
                percentage * 100
            )
        );

    document.getElementById("progress")
        .style.width = percentage + "%";

}


/* =========================================
   NAVEGAÇÃO
========================================= */

function nextPage() {

    if (rendition) {
        rendition.next();
    }

}


function previousPage() {

    if (rendition) {
        rendition.prev();
    }

}


/* =========================================
   MARCADOR
========================================= */

function bookmark() {

    if (
        !currentLocation ||
        !currentLocation.start
    ) {

        alert("Não foi possível criar o marcador.");

        return;

    }

    const cfi =
        currentLocation.start.cfi;

    localStorage.setItem(
        STORAGE_BOOKMARK,
        cfi
    );

    savedBookmark = cfi;

    alert("🔖 Marcador salvo!");

}


function goToBookmark() {

    const bookmarkPosition =
        localStorage.getItem(STORAGE_BOOKMARK);

    if (!bookmarkPosition) {

        alert("Você ainda não criou um marcador.");

        return;

    }

    rendition.display(bookmarkPosition);

    closeSettings();

}


/* =========================================
   MODO FOCO
========================================= */

function toggleFocus() {

    document.body.classList.toggle("focus");

}


/* =========================================
   CONFIGURAÇÕES
========================================= */

function openSettings() {

    document
        .getElementById("settings")
        .classList.add("open");

}


function closeSettings() {

    document
        .getElementById("settings")
        .classList.remove("open");

}


/* =========================================
   TAMANHO DA FONTE
========================================= */

function changeFontSize(value) {

    if (!rendition) {
        return;
    }

    rendition.themes.fontSize(
        value + "%"
    );

    localStorage.setItem(
        STORAGE_FONT,
        value
    );

}


/* =========================================
   ESPAÇAMENTO
========================================= */

function changeLineHeight(value) {

    if (!rendition) {
        return;
    }

    rendition.themes.override(
        "line-height",
        value
    );

    localStorage.setItem(
        STORAGE_LINE,
        value
    );

}


/* =========================================
   TEMA
========================================= */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        STORAGE_THEME,
        dark ? "dark" : "light"
    );


    if (rendition) {

        if (dark) {

            rendition.themes.override(
                "background",
                "#171513"
            );

            rendition.themes.override(
                "color",
                "#eee4d8"
            );

        } else {

            rendition.themes.override(
                "background",
                "#f4ead8"
            );

            rendition.themes.override(
                "color",
                "#33271f"
            );

        }

    }

}


/* =========================================
   RESTAURAR CONFIGURAÇÕES
========================================= */

function applySavedSettings() {

    const theme =
        localStorage.getItem(STORAGE_THEME);

    const font =
        localStorage.getItem(STORAGE_FONT);

    const line =
        localStorage.getItem(STORAGE_LINE);


    /* tema */

    if (theme === "dark") {

        document.body.classList.add("dark");

        rendition.themes.override(
            "background",
            "#171513"
        );

        rendition.themes.override(
            "color",
            "#eee4d8"
        );

    }


    /* fonte */

    if (font) {

        document.getElementById("fontSize")
            .value = font;

        rendition.themes.fontSize(
            font + "%"
        );

    }


    /* espaçamento */

    if (line) {

        document.getElementById("lineHeight")
            .value = line;

        rendition.themes.override(
            "line-height",
            line
        );

    }

}


/* =========================================
   INICIAR
========================================= */

startBook();

</script>

</body>
</html>
